[build]
  command = "npm run build"
  publish = "dist"

# Proxy all /api/* calls to Render backend
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-RENDER-BACKEND.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback (React router safety)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200